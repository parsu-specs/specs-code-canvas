<!doctype html>
<html lang="en" class="min-h-full w-full max-w-full scroll-smooth">
  <head>
    <meta charset="utf-8" />
    <link
      rel="preload"
      href="/node_modules/@fontsource/fredoka/files/fredoka-latin-700-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/node_modules/@fontsource/nunito/files/nunito-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/node_modules/@fontsource/nunito/files/nunito-latin-700-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/node_modules/@fontsource/nunito/files/nunito-latin-900-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link id="cc-favicon" rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="A community app store by SPECS, a computer science student organization, where student developers publish software, exchange feedback, find collaborators, and share progress."
    />
    <title>CodeCanvas · The app store for developers</title>
  </head>
  <body
    class="relative isolate m-0 min-h-full w-full min-w-0 max-w-full bg-transparent font-sans text-foreground"
  >
    <div id="root" class="min-h-full w-full min-w-0 max-w-full overflow-x-clip">
      <div
        class="startup-placeholder flex min-h-screen items-center justify-center gap-2"
        role="status"
        aria-label="Loading CodeCanvas"
      >
        <span
          class="size-3 animate-loader-bounce rounded-full border-2 border-outline bg-secondary motion-reduce:animate-none"
        ></span>
        <span
          class="size-3 animate-loader-bounce rounded-full border-2 border-outline bg-accent [animation-delay:120ms] motion-reduce:animate-none"
        ></span>
        <span
          class="size-3 animate-loader-bounce rounded-full border-2 border-outline bg-success [animation-delay:240ms] motion-reduce:animate-none"
        ></span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
